<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Login | BasinAgentic</title><meta name="description" content="BasinAgentic secure Clerk sign in and registration">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;font-family:Arial,Helvetica,sans-serif;color:#0d2d52;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 85% 15%,#225dbb 0,transparent 37%),linear-gradient(125deg,#071a33,#0b327a 65%,#123d86)}.shell{width:min(100%,520px)}.card{border-radius:24px;background:#f8fbff;padding:32px 22px;box-shadow:0 20px 70px #00142c66;text-align:center}.mark{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:14px;color:white;background:linear-gradient(130deg,#102e59,#2866d7,#ef5c24);font-size:21px}h1{margin:13px 0 7px;font-size:29px}.lead{margin:0 0 20px;line-height:1.5;color:#59708b;font-size:14px}#clerk-auth{display:flex;justify-content:center;min-height:220px}#notice{border-radius:12px;background:#fff1e5;color:#9b391b;padding:12px;margin:12px 0;line-height:1.5;font-size:13px}#notice[hidden]{display:none}.back{display:block;color:#d5e8ff;text-align:center;margin-top:17px;font-size:14px;text-decoration:none;font-weight:700}
.ba-legal-note{margin:15px auto 0;max-width:420px;border-top:1px solid #dce5f3;padding:16px 4px 0;color:#546983;font-size:12px;line-height:1.65}
.ba-legal-note a{color:#1554b2;font-weight:700;text-decoration:underline;text-underline-offset:2px}
.ba-legal-note a:hover,.ba-legal-note a:focus-visible{color:#ad3d1e}
</style>
</head><body><div class="shell"><main class="card"><div class="mark"><i class="fa-solid fa-user-lock"></i></div><h1>Client Portal</h1><p class="lead">Secure sign in and registration · Powered by Clerk</p><div id="notice" hidden role="alert"></div><div id="clerk-auth"></div>
<p class="ba-legal-note">By signing in or creating an account, you acknowledge our
  <a href="subscription-agreement.html" target="_blank" rel="noopener noreferrer">Terms of Service</a>
  and <a href="privacy.html" target="_blank" rel="noopener noreferrer">Privacy Policy</a>.
</p></main><a class="back" href="index.html#pricing">← Back to Plans &amp; Pricing</a></div>
<script src="config.js"></script><script src="auth.js"></script><script>
(async()=>{const n=document.getElementById('notice');try{const clerk=await BA_AUTH.init();const q=new URLSearchParams(location.search);const plan=q.get('plan');const dest=new URL('portal.html',location.href);if(['production-pro','basin-intelligence'].includes(plan)){dest.searchParams.set('plan',plan);dest.hash='plans';}if(clerk.user){location.replace(dest.toString());return;}const props={fallbackRedirectUrl:dest.toString(),signUpFallbackRedirectUrl:dest.toString(),signInFallbackRedirectUrl:dest.toString()};if(q.get('signup')==='1')clerk.mountSignUp(document.getElementById('clerk-auth'),props);else clerk.mountSignIn(document.getElementById('clerk-auth'),props);}catch(e){n.hidden=false;n.textContent=e.message||'Unable to connect to Clerk';}})();
</script></body></html>
