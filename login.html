<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="BasinAgentic Client Portal secure sign in"><title>Client Portal | BasinAgentic</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 3%,#154ba8 0,transparent 45%),radial-gradient(circle at 15% 88%,#225dc1 0,transparent 42%),linear-gradient(135deg,#29283b,#073268 70%,#1950a4);color:#0b2344;padding:30px 14px}
.main{width:min(100%,500px);border-radius:24px;padding:34px;background:#f7f9fd;box-shadow:0 22px 80px #001a3b55}.symbol{width:50px;height:50px;margin:0 auto 14px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(130deg,#081b36,#255ee2 65%,#f15b20);color:white;font-size:20px;box-shadow:0 6px 20px #1d57ad45}h1{margin:0;text-align:center;font-size:26px;letter-spacing:-.03em}.lead{text-align:center;color:#61738b;margin:9px 0 27px;font-size:14px;line-height:1.45}.plan-banner{padding:11px;background:#e6f0ff;border:1px solid #c2d8ff;border-radius:10px;font-size:13px;color:#18488e;margin:-9px 0 20px;text-align:center;font-weight:700}.field{margin:15px 0}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:7px}.input{display:flex;align-items:center;gap:10px;padding:0 12px;min-height:48px;border:1px solid #ccd8e9;border-radius:12px}.input:focus-within{outline:2px solid #79adff}.input i{color:#1655bc}.input input{font:inherit;border:0;background:transparent;outline:0;min-width:0;width:100%;padding:13px 0;font-size:14px}.show{border:0;background:none;color:#4a6589;font-weight:900;cursor:pointer;font-size:11px}.links{display:flex;align-items:center;justify-content:space-between;margin:14px 0 22px;gap:10px;color:#465b77;font-size:12px}.links a,.terms a{color:#154fa7;font-weight:900;text-decoration:none}.primary{display:block;width:100%;border:0;border-radius:12px;background:linear-gradient(120deg,#081d3a,#225dea 72%,#f4511e);color:white;padding:16px;cursor:pointer;font-weight:900;letter-spacing:.015em;font-size:14px}.primary:disabled{opacity:.65;cursor:wait}.separator{display:flex;align-items:center;gap:12px;justify-content:center;margin:24px 0;color:#91a1b6;font-size:10px;font-weight:900;letter-spacing:.1em}.separator:before,.separator:after{content:'';height:1px;background:#d6e1ef;flex:1}.secondary{width:100%;background:transparent;border:1px solid #c8d5e8;border-radius:12px;padding:14px;font-size:13px;font-weight:900;color:#102948;cursor:pointer}.terms{font-size:11px;color:#657891;line-height:1.55;text-align:center;margin:21px auto 0;max-width:360px}.notice{padding:12px;font-size:13px;border-radius:11px;line-height:1.45;margin-bottom:14px;background:#e8f1ff;color:#214a88}.notice.error{background:#fee9e7;color:#ac231b}.hidden{display:none!important}.back{display:block;text-align:center;color:#cfe1ff;text-decoration:none;font-weight:700;margin-top:16px;font-size:13px}a:focus-visible,button:focus-visible{outline:3px solid #ffbc83;outline-offset:2px}@media(max-width:520px){.main{padding:26px 21px;border-radius:21px}}
</style></head><body>
<div><main class="main">
  <div class="symbol"><i class="fa-solid fa-user-lock"></i></div>
  <h1>Client Portal</h1><p class="lead">Sign in to generate and directly download BasinAgentic reports.</p>
  <div class="plan-banner hidden" id="plan-banner"></div><div class="notice hidden" id="notice" role="status"></div>
  <form id="form">
    <div class="field"><label for="email">Email Address</label><div class="input"><i class="fa-regular fa-envelope"></i><input id="email" type="email" placeholder="name@company.com" autocomplete="email" required></div></div>
    <div class="field"><label for="password" id="password-label">Password</label><div class="input"><i class="fa-solid fa-lock"></i><input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required minlength="6"><button class="show" id="toggle" type="button">SHOW</button></div></div>
    <div class="links" id="login-links"><label><input type="checkbox" id="remember" checked> Remember me</label><a href="#" id="forgot">Forgot password?</a></div>
    <button class="primary" id="submit" type="submit">SIGN IN <i class="fa-solid fa-arrow-right"></i></button>
  </form>
  <div class="separator" id="separator">NEW TO BASINAGENTIC?</div>
  <button class="secondary" id="switch" type="button">CREATE CLIENT ACCOUNT</button>
  <p class="terms">By signing in, you agree to our <a href="subscription.html">MAIN SUBSCRIPTION AGREEMENT</a> and <a href="privacy.html">ONLINE PRIVACY POLICY</a>.</p>
</main><a class="back" href="index.html#pricing">← Back to BasinAgentic Plans &amp; Pricing</a></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script src="config.js"></script><script src="auth.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);const q=new URLSearchParams(location.search);
let mode='login';const plan=['production-pro','basin-intelligence'].includes(q.get('plan'))?q.get('plan'):null;
function inform(message,error=false){$('notice').textContent=message;$('notice').className='notice'+(error?' error':'');}
function setMode(next){mode=next;$('notice').classList.add('hidden');$('login-links').classList.toggle('hidden',next!=='login');$('password-label').textContent=next==='recovery'?'New password':'Password';$('password').autocomplete=next==='signup'?'new-password':'current-password';$('submit').textContent=next==='signup'?'CREATE ACCOUNT':next==='forgot'?'SEND RESET EMAIL':next==='recovery'?'UPDATE PASSWORD':'SIGN IN →';$('switch').textContent=next==='login'?'CREATE CLIENT ACCOUNT':'BACK TO SIGN IN';$('separator').textContent=next==='login'?'NEW TO BASINAGENTIC?':'ALREADY REGISTERED?';$('password').closest('.field').classList.toggle('hidden',next==='forgot');$('password').required=next!=='forgot';}
$('toggle').addEventListener('click',()=>{const p=$('password');p.type=p.type==='password'?'text':'password';$('toggle').textContent=p.type==='password'?'SHOW':'HIDE';});
$('switch').addEventListener('click',()=>setMode(mode==='login'?'signup':'login'));
$('forgot').addEventListener('click',e=>{e.preventDefault();setMode('forgot')});
if(plan){$('plan-banner').classList.remove('hidden');$('plan-banner').textContent=(plan==='production-pro'?'Production Pro — $149/month':'Basin Intelligence — $449/month')+' · Sign in or create an account to subscribe.';}
if(q.get('recovery')==='1')setMode('recovery');
$('form').addEventListener('submit',async e=>{
 e.preventDefault();const btn=$('submit');btn.disabled=true;try{
  if(!BA_AUTH.ready)throw Error(BA_AUTH.message);
  const email=$('email').value.trim(),password=$('password').value;
  if(mode==='forgot'){
    const {error}=await BA_AUTH.client.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/login.html?recovery=1'});if(error)throw error;inform('Password reset instructions have been sent if this address has an account.');return;
  }
  if(mode==='recovery'){
    const {error}=await BA_AUTH.client.auth.updateUser({password});if(error)throw error;inform('Password updated. You can now sign in.');setMode('login');return;
  }
  if(mode==='signup'){
    const redirect=location.origin+'/login.html?verified=1'+(plan?'&plan='+encodeURIComponent(plan):'');
    const {data,error}=await BA_AUTH.client.auth.signUp({email,password,options:{emailRedirectTo:redirect}});if(error)throw error;
    if(data.session){location.assign('portal.html'+(plan?'?plan='+encodeURIComponent(plan):''));return;}
    inform('Check your email to confirm your account. Return and sign in to finish your subscription.');return;
  }
  const {error}=await BA_AUTH.client.auth.signInWithPassword({email,password});if(error)throw error;
  location.assign('portal.html'+(plan?'?plan='+encodeURIComponent(plan):''));
 }catch(err){inform(err.message||'Unable to sign in',true)}finally{btn.disabled=false;}
});
(async()=>{if(!BA_AUTH.ready){inform(BA_AUTH.message,true);return;}if(q.get('verified')==='1')inform('Email verified. Sign in to continue.');else if(mode==='login'){const {data}=await BA_AUTH.client.auth.getSession();if(data.session){location.replace('portal.html'+(plan?'?plan='+encodeURIComponent(plan):''));}}})();
</script></body></html>
